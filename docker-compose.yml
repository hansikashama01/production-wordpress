services:
  db:
    image: mariadb:${MARIADB_VERSION:-10}
    container_name: wp_db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - /opt/www/mysql:/var/lib/mysql
    networks:
      - wp_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 15

  wordpress:
    image: wordpress:php${PHP_VERSION:-8.2}-apache
    container_name: wp_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
    volumes:
      - /opt/www/wordpress:/var/www/html
    networks:
      - wp_net
    ports:
      - "8080:80"   # 🔥 IMPORTANT FIX (direct access)
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  wpcli:
    image: wordpress:cli
    container_name: wp_cli
    depends_on:
      - wordpress
      - db
    volumes:
      - /opt/www/wordpress:/var/www/html
    working_dir: /var/www/html
    networks:
      - wp_net

  varnish:
    image: varnish:7.5
    container_name: wp_varnish
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
    command:
      - varnishd
      - -F
      - -f
      - /etc/varnish/default.vcl
      - -s
      - malloc,512m
      - -a
      - :6081
    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
    ports:
      - "8081:6081"   # optional (8081 for varnish testing)
    networks:
      - wp_net

networks:
  wp_net:
    name: wordpress-network
    external: true
